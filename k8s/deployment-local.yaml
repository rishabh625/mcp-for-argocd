apiVersion: v1
kind: Namespace
metadata:
  name: argocd-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-mcp
  namespace: argocd-mcp
spec:
  selector:
    app: argocd-mcp
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
    - name: callback
      protocol: TCP
      port: 8085
      targetPort: 8085
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-mcp
  namespace: argocd-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-mcp
  template:
    metadata:
      labels:
        app: argocd-mcp
    spec:
      containers:
        - name: argocd-mcp
          image: argoproj-labs/mcp-for-argocd:latest
          imagePullPolicy: IfNotPresent
          command:
            - "node"
            - "dist/index.js"
          args:
            - "http"
            - "--server-url"
            - "http://argocd-server.argocd.svc.cluster.local"
            - "--callback-port"
            - "8085"
          ports:
            - containerPort: 3000
            - containerPort: 8085
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
