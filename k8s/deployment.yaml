apiVersion: v1
kind: Namespace
metadata:
  name: argocd-mcp
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-mcp
  namespace: argocd-mcp
spec:
  selector:
    app: argocd-mcp
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
    - name: callback
      protocol: TCP
      port: 8085
      targetPort: 8085
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-mcp
  namespace: argocd-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-mcp
  template:
    metadata:
      labels:
        app: argocd-mcp
    spec:
      containers:
        - name: argocd-mcp
          # Replace with your container image
          image: argoproj-labs/mcp-for-argocd:latest
          imagePullPolicy: IfNotPresent
          command:
            - "node"
            - "dist/index.js"
          args:
            - "http"
            - "--server-url"
            # Use ArgoCD's internal service URL for cluster communication
            - "http://argocd-server.argocd.svc.cluster.local"
            - "--callback-port"
            - "8085"
            # Replace with your actual callback URL (e.g., https://argocd-mcp.example.com/auth/callback)
            - "--callback-url"
            - "http://argocd-mcp.example.com/auth/callback"
          ports:
            - containerPort: 3000
            - containerPort: 8085
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
---
# Istio Gateway (for public access)
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: argocd-mcp-gateway
  namespace: argocd-mcp
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    # Optional: Redirect HTTP to HTTPS
    # tls:
    #   httpsRedirect: true
    hosts:
    - "argocd-mcp.example.com" # Replace with your actual domain
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: argocd-mcp-tls # Replace with your TLS cert secret
    hosts:
    - "argocd-mcp.example.com" # Replace with your actual domain
---
# Istio VirtualService to route traffic
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: argocd-mcp-vs
  namespace: argocd-mcp
spec:
  hosts:
  - "argocd-mcp.example.com" # Replace with your actual domain
  gateways:
  - argocd-mcp-gateway
  http:
  # Route OAuth callback requests to port 8085
  - route:
    - destination:
        host: argocd-mcp
        port:
          number: 8085
    match:
    - uri:
        prefix: "/auth"
  # Route all other requests to the main MCP server on port 3000
  - route:
    - destination:
        host: argocd-mcp
        port:
          number: 3000
